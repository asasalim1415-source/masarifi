<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصاريفي</title>
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصاريفي">

<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: single-column phone ledger, sticky header, bottom tab bar; wide screens center at 560px */
:root {
  --bg: #EEF1EF; --surface: #FFFFFF; --sunk: #E3E8E5; --line: #D3DAD6;
  --ink: #16211D; --muted: #5C6964; --accent: #1E4E8C; --accent-ink: #FFFFFF;
  --income: #23764A; --expense: #A73B36; --pending: #B7791F; --pending-bg: #FBF1DE;
  --f-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1413; --surface: #172120; --sunk: #0A0F0E; --line: #263231;
  --ink: #E6ECE9; --muted: #92A29C; --accent: #8DB0EE; --accent-ink: #0E1413;
  --income: #6FD39C; --expense: #F2897F; --pending: #E8B65A; --pending-bg: #2A2416; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1413; --surface: #172120; --sunk: #0A0F0E; --line: #263231;
  --ink: #E6ECE9; --muted: #92A29C; --accent: #8DB0EE; --accent-ink: #0E1413;
  --income: #6FD39C; --expense: #F2897F; --pending: #E8B65A; --pending-bg: #2A2416; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 24px; margin: 0; letter-spacing: -0.01em; }
h2 { font-family: var(--f-display); font-weight: 500; font-size: 16px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
section { display: grid; gap: 10px; margin-top: 22px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.count { background: var(--pending); color: var(--surface); border-radius: 99px; font-size: 12px; padding: 0 8px; margin-inline-start: 6px; font-weight: 600; }

/* ledger summary */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
.ledger > div { padding: 12px 12px; display: grid; gap: 2px; min-width: 0; }
.ledger > div + div { border-inline-start: 1px dashed var(--line); }
.ledger .lbl { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.ledger .val { font-family: var(--f-display); font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
.inc { color: var(--income); } .exp { color: var(--expense); }
.cur { font-size: 11px; color: var(--muted); margin-inline-start: 3px; font-family: var(--f-body); }

/* transaction rows */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 11px 12px; width: 100%; text-align: start; background: none; border: 0; }
.row + .row { border-top: 1px solid var(--line); }
.dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: #fff; font-family: var(--f-display); }
.dot.empty { background: var(--sunk); color: var(--muted); border: 1px dashed var(--line); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 600; text-align: end; }
.day { font-size: 12px; color: var(--muted); padding: 8px 12px 4px; background: var(--sunk); letter-spacing: .02em; }

/* pending cards */
.pend { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--pending); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.pend.in { border-inline-start-color: var(--income); }
.pend .hd { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.pend .hd > div { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 5px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip:hover { border-color: var(--accent); }
.chip.ghost { background: none; color: var(--muted); border-style: dashed; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.question { font-size: 14px; }

/* forms */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], input[type=datetime-local], input[type=search], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; color: var(--ink); min-width: 0; }
textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--sunk); color: var(--ink); }
.btn.danger { background: none; color: var(--expense); border: 1px solid var(--expense); }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 8px; border-radius: 9px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.hint { font-size: 13px; color: var(--muted); }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.new { background: var(--accent); color: var(--accent-ink); }
.tag.warn { background: var(--pending-bg); color: var(--pending); }
.banner { background: var(--pending-bg); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.empty-state { text-align: center; color: var(--muted); padding: 22px 12px; font-size: 14px; }

/* reports */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.monthnav button { border: 0; background: var(--sunk); width: 38px; height: 38px; border-radius: 10px; font-size: 18px; }
.donut-wrap { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 14px; align-items: center; }
@media (max-width: 400px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .donut-wrap .legend { width: 100%; } }
.legend { display: grid; gap: 8px; }
.lg { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.lg i { width: 10px; height: 10px; border-radius: 3px; }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; grid-column: 2 / 4; }
.bar > b { display: block; height: 100%; border-radius: 99px; }
.bar.over > b { background: var(--expense) !important; }
svg text { fill: var(--muted); font-family: var(--f-body); font-size: 10px; }
svg .center-big { fill: var(--ink); font-family: var(--f-display); font-size: 17px; font-weight: 600; }
svg .gridl { stroke: var(--line); stroke-width: 1; }
svg .b-in { fill: var(--income); } svg .b-ex { fill: var(--expense); }
.chart-scroll { overflow-x: auto; }
.keyrow { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.keyrow span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-inline-end: 5px; vertical-align: middle; background: currentColor; }
.keyrow .k-in { color: var(--income); } .keyrow .k-ex { color: var(--expense); }

/* settings */
.set-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .grow { flex: 1; min-width: 0; }
.set-row .grow div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { border: 0; background: none; color: var(--muted); padding: 6px 8px; border-radius: 8px; font-size: 13px; }
.iconbtn:hover { background: var(--sunk); color: var(--ink); }
ol.steps { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; font-size: 14px; }
code, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--sunk); padding: 1px 5px; border-radius: 5px; direction: ltr; unicode-bidi: isolate; }
details.card summary { cursor: pointer; font-weight: 600; font-family: var(--f-display); }
pre.raw { white-space: pre-wrap; background: var(--sunk); border-radius: 10px; padding: 10px; font-size: 13px; margin: 0; max-height: 160px; overflow: auto; }

/* tab bar */
nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { border: 0; background: none; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--accent); font-weight: 600; }
nav.tabs button.add .plus { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
nav.tabs button.add .plus svg { stroke: var(--accent-ink); }
.badge { position: absolute; top: 4px; inset-inline-end: 22%; background: var(--pending); color: #fff; font-size: 10px; border-radius: 99px; min-width: 16px; padding: 0 4px; line-height: 16px; }
nav.tabs button { position: relative; }

/* sheet + toast */
.scrim { position: fixed; inset: 0; background: rgba(5,10,9,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88%; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.sheet .grab { width: 40px; height: 4px; background: var(--line); border-radius: 9px; justify-self: center; }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6 } } }

/* wallet / balance */
.wallet { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.wallet .lbl { font-size: 12px; opacity: .8; letter-spacing: .02em; }
.wallet .cur, .wallet .sub { color: inherit; opacity: .75; }
.wallet .exp { color: inherit; }
.w-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.w-top > div:first-child { min-width: 0; }
.w-total { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.wallet .iconbtn { color: inherit; background: color-mix(in srgb, var(--accent-ink) 14%, transparent); }
.wallet .iconbtn:hover { background: color-mix(in srgb, var(--accent-ink) 24%, transparent); color: inherit; }
.iconbtn.eye { display: grid; place-items: center; width: 34px; height: 30px; padding: 0; }
.iconbtn.eye svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.w-accts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.w-acct { border: 0; color: inherit; background: color-mix(in srgb, var(--accent-ink) 12%, transparent); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; text-align: start; min-width: 0; }
.w-acct .w-val { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.masked { letter-spacing: .12em; }
.chip .more { opacity: .5; font-size: 12px; margin-inline-start: 2px; }
.subs { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }

/* Hide the "Powered by Netlify" badge that Netlify injects */
#nl-badge-frame, iframe[id^="nl-badge"] { display: none !important; }
label.btn { display: inline-flex; align-items: center; cursor: pointer; }

/* remaining after fixed payments */
.w-after { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--accent-ink) 22%, transparent); font-size: 13px; }
.w-after .w-val { font-weight: 600; font-size: 15px; }
.late { color: var(--expense); font-weight: 600; }
.iconbtn.small { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px; margin-top: 2px; }

/* transfer question + unknown account */
.pend.xfer { border-inline-start-color: var(--accent); }
.acct-pick { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--pending); font-weight: 600; }
.acct-pick select { width: auto; padding: 4px 8px; font-size: 14px; border-radius: 8px; }

/* lock screen */
.lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
.lock-in { display: grid; justify-items: center; gap: 14px; width: min(300px, 100%); text-align: center; }
.lock .sub { min-height: 2.6em; }
.pin-dots { display: flex; gap: 16px; direction: ltr; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); }
.pin-dots i.on { background: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; direction: ltr; margin-top: 8px; }
.keypad button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; font-family: var(--f-display); font-size: 26px; color: var(--ink); }
.keypad button:active { background: var(--sunk); }
.keypad .kp-sm { font-size: 14px; background: none; box-shadow: none; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .pin-dots.shake { animation: shake .3s; } @keyframes shake { 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } } }

/* one-tap reminder of your previous category */
.sug { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--sunk); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.sug b { font-weight: 600; }
</style>
</head><body>
<main id="app" dir="rtl" lang="ar"></main>
<nav class="tabs" id="tabs" dir="rtl"></nav>

<script src="app.js"></script>
